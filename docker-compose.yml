version: "3.8"

services:
  whatsapp-bot:
    build: .
    # Sugestão: renomear para refletir a nova biblioteca
    container_name: whatsapp-baileys-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Volume CORRETO para persistir a sessão da Baileys
      - ./baileys_auth_info:/app/baileys_auth_info
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
